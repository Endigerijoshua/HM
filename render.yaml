# Render blueprint ─ single web service hosting the FastAPI backend.
#
# The frontend is deployed separately on Vercel (static build pushed from
# `frontend/dist`); point its `VITE_API_BASE_URL` at the backend's public URL.
# The backend self-seeds SQLite on every boot (see app/main.py lifespan), so no
# manual seed step is needed even though Render uses an ephemeral filesystem.
services:
  - type: web
    name: temporal-civic-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: TCIVIC_DATABASE_URL
        value: sqlite:///./civic_demo.db
      - key: TCIVIC_SEED_ON_STARTUP
        value: "true"
      # Comma-separated list of allowed CORS origins (no trailing slash per
      # origin; browsers send the Origin header without one). The Vercel
      # frontend plus the local dev servers.
      - key: TCIVIC_CORS_ORIGINS
        value: https://hm-gamma-kohl.vercel.app,http://localhost:5173,http://localhost:8080
